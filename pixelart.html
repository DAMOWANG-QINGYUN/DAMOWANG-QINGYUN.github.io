<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>视觉实验 | 蔡青芸作品集</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-logo">← 返回首页</a>
        </div>
    </nav>

    <section class="detail-hero">
        <div class="container">
            <div class="detail-header fade-in">
                <h1>视觉实验</h1>
                <p class="detail-subtitle">角色设计 · 环境场景 · 特效动画 · UI 元素</p>
                <div class="card-tags" style="justify-content: center; margin-top: 16px;">
                    <span class="tag">像素美术</span>
                    <span class="tag">角色设计</span>
                    <span class="tag">视觉概念</span>
                </div>
            </div>
        </div>
    </section>

    <!-- 角色设计 -->
    <section class="detail-section">
        <div class="container">
            <h2 class="section-title fade-in">角色设计</h2>
            <div class="pixel-grid fade-in">
                <div class="pixel-item">
                    <img src="assets/images/pixel/maid.png" alt="女仆角色" loading="lazy">
                    <p>Maid</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/black.png" alt="黑色角色" loading="lazy">
                    <p>Black</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/green.png" alt="绿色角色" loading="lazy">
                    <p>Green</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/purple.png" alt="紫色角色" loading="lazy">
                    <p>Purple</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 环境场景 -->
    <section class="detail-section alt-bg">
        <div class="container">
            <h2 class="section-title fade-in">环境场景</h2>
            <div class="pixel-grid fade-in">
                <div class="pixel-item">
                    <img src="assets/images/pixel/road.png" alt="道路" loading="lazy">
                    <p>Road</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/snow.png" alt="雪景" loading="lazy">
                    <p>Snow</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/tree .png" alt="树" loading="lazy">
                    <p>Tree</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 特效动画 -->
    <section class="detail-section">
        <div class="container">
            <h2 class="section-title fade-in">特效</h2>
            <div class="pixel-grid fade-in">
                <div class="pixel-item">
                    <img src="assets/images/pixel/fire.png" alt="火焰" loading="lazy">
                    <p>Fire</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/shine.png" alt="光芒" loading="lazy">
                    <p>Shine</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/ego  swallow .png" alt="吞噬" loading="lazy">
                    <p>Ego Swallow</p>
                </div>
            </div>
        </div>
    </section>

    <!-- UI 元素 -->
    <section class="detail-section alt-bg">
        <div class="container">
            <h2 class="section-title fade-in">UI 元素</h2>
            <div class="pixel-grid fade-in">
                <div class="pixel-item">
                    <img src="assets/images/pixel/blue eye.png" alt="蓝眼" loading="lazy">
                    <p>Blue Eye</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/butterfly.png" alt="蝴蝶" loading="lazy">
                    <p>Butterfly</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/chocolate.png" alt="巧克力" loading="lazy">
                    <p>Chocolate</p>
                </div>
                <div class="pixel-item">
                    <img src="assets/images/pixel/red thread.png" alt="红线" loading="lazy">
                    <p>Red Thread</p>
                </div>
            </div>
        </div>
    </section>

    <!-- 手绘 -->
    <section class="detail-section">
        <div class="container">
            <h2 class="section-title fade-in">手绘</h2>
            <div class="detail-gallery fade-in">
                <div class="gallery-item">
                    <a href="assets/images/sketch/stare.png" target="_blank">
                        <img src="assets/images/sketch/stare.png" alt="凝视" loading="lazy">
                    </a>
                    <p class="gallery-caption">Stare</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p><a href="index.html">← 返回首页</a></p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
